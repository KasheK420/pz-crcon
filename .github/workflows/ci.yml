name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Placeholder jobs — will be expanded once tech stack is finalized.
  # For now they validate the repo structure and enforce hygiene.

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .

  validate-structure:
    name: Validate repo structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          set -e
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md .gitignore .env.example; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all required files present"

      - name: .env is not committed
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.[^e]' | grep -v '\.env\.example'; then
            echo "ERROR: .env files detected in repository"
            exit 1
          fi
          echo "no .env files tracked — good"
