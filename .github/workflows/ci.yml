name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint -d "relaxed" .

  validate-structure:
    name: Validate repo structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          set -e
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md .gitignore .env.example; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all required files present"
      - name: .env is not committed
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.[^e]' | grep -v '\.env\.example'; then
            echo "ERROR: .env files detected in repository"
            exit 1
          fi
          echo "no .env files tracked — good"

  app:
    name: App (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: "0123456789abcdef0123456789abcdef0"
      DATABASE_URL: postgresql://x:y@localhost:5432/z
      DISCORD_CLIENT_ID: ci
      DISCORD_CLIENT_SECRET: ci
      DISCORD_ADMIN_IDS: "286560250578862080"
      RCON_HOST: 127.0.0.1
      RCON_PORT: "27015"
      RCON_PASSWORD: ci
      WEBHOOK_HMAC_SECRET: "0123456789abcdef0123456789abcdef0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test
      - name: Build
        run: pnpm build

  docker-proxy-smoke:
    # Opt-in: manual trigger only, so the default PR run isn't blocked
    # on docker-in-docker setup. Enable via Actions → "CI" → "Run workflow".
    name: docker-socket-proxy endpoint matrix
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: "0123456789abcdef0123456789abcdef0"
      DATABASE_URL: postgresql://x:y@localhost:5432/z
      DISCORD_CLIENT_ID: ci
      DISCORD_CLIENT_SECRET: ci
      DISCORD_ADMIN_IDS: "286560250578862080"
      RCON_HOST: 127.0.0.1
      RCON_PORT: "27015"
      RCON_PASSWORD: ci
      WEBHOOK_HMAC_SECRET: "0123456789abcdef0123456789abcdef0"
      DOCKER_IN_DOCKER: "1"
      DOCKER_PROXY_TEST_URL: http://localhost:2375
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Pull proxy image
        run: docker pull tecnativa/docker-socket-proxy:latest
      - name: Start docker-socket-proxy
        run: |
          docker run -d --name proxy \
            -p 2375:2375 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e CONTAINERS=1 \
            -e POST=1 \
            -e CONTAINERS_START=1 \
            -e CONTAINERS_STOP=1 \
            -e CONTAINERS_RESTART=1 \
            -e CONTAINERS_KILL=1 \
            tecnativa/docker-socket-proxy:latest
      - name: Wait for proxy readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:2375/_ping >/dev/null 2>&1; then
              echo "proxy ready"; exit 0
            fi
            sleep 1
          done
          echo "proxy never came up"; docker logs proxy; exit 1
      - name: Pull alpine test image
        run: docker pull alpine:3.19
      - name: Run docker-proxy smoke test
        run: pnpm vitest run tests/integration/docker-proxy.endpoints.test.ts
      - name: Proxy logs (on failure)
        if: failure()
        run: docker logs proxy
