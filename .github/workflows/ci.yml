name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint -d "relaxed" .

  validate-structure:
    name: Validate repo structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          set -e
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md .gitignore .env.example; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all required files present"
      - name: .env is not committed
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.[^e]' | grep -v '\.env\.example'; then
            echo "ERROR: .env files detected in repository"
            exit 1
          fi
          echo "no .env files tracked — good"

  app:
    name: App (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: "0123456789abcdef0123456789abcdef0"
      DATABASE_URL: postgresql://x:y@localhost:5432/z
      DISCORD_CLIENT_ID: ci
      DISCORD_CLIENT_SECRET: ci
      DISCORD_GUILD_ID: ci
      DISCORD_ADMIN_ROLE_ID: ci
      DISCORD_BOT_TOKEN: ci
      BOOTSTRAP_OWNER_DISCORD_ID: ci
      RCON_HOST: 127.0.0.1
      RCON_PORT: "27015"
      RCON_PASSWORD: ci
      WEBHOOK_HMAC_SECRET: "0123456789abcdef0123456789abcdef0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test
      - name: Build
        run: pnpm build
